name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm pack --pack-destination .
      - run: |
          file=$(ls dsh-net-hosts-*.tgz | head -1)
          cp "$file" dsh-net-hosts.tgz
      - uses: softprops/action-gh-release@v2
        with:
          files: dsh-net-hosts.tgz
